<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Social networks meta -->
    <!-- Twitter -->
    <meta content="summary_large_image" name="twitter:card" />
    <meta
      content="https://privacy.leocorporation.dev/img/social.png"
      name="twitter:image"
    />
    <meta
      content="Léo Corporation's official website. Software creation for Windows."
      name="twitter:description"
    />
    <meta content="Privacy | Léo Corporation" name="twitter:title" />
    <!-- Facebook/Linkedin -->
    <meta
      content="Léo Corporation's official website. Software creation for Windows."
      property="og:description"
    />
    <meta
      content="https://privacy.leocorporation.dev/img/social.png"
      property="og:image"
    />
    <meta content="Privacy | Léo Coporation" property="og:title" />

    <meta
      content="Léo Corporation's Privacy policy for its website."
      name="description"
    />

    <title>Privacy | Léo Corporation</title>
    <link href="https://fonts.gstatic.com" rel="preconnect" />

    <link href="css/tailwind.css" rel="stylesheet" />
    <link href="css/global.css" rel="stylesheet" />
    <script
      defer
      src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js"
    ></script>
    <link href="favicon.png" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Domine:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-white text-black dark:text-white dark:bg-[#000014]"
    style="font-family: Hauora, sans-serif"
  >
    <div
      class="w-full sticky top-0 text-gray-700 dark:bg-[rgba(31,41,55,0.5)] bg-[rgba(255,255,255,0.1)] dark:text-gray-200"
      id="header"
      style="z-index: 1000"
    >
      <style>
        @font-face {
          font-family: "Hauora";
          src: url("fonts/Hauora-Regular.ttf") format("truetype");
          font-weight: 400;
          font-style: normal;
        }

        @font-face {
          font-family: "Hauora";
          src: url("fonts/Hauora-ExtraBold.ttf") format("truetype");
          font-weight: 700;
        }

        @font-face {
          font-family: "Hauora";
          src: url("fonts/Hauora-ExtraBold.ttf") format("truetype");
          font-weight: 900;
        }

        @font-face {
          font-family: "Hauora";
          src: url("fonts/Hauora-SemiBold.ttf") format("truetype");
          font-weight: 600;
        }
      </style>
      <div
        class="flex flex-col max-w-screen-xl px-4 mx-auto md:items-center md:justify-between md:flex-row md:px-6 lg:px-8"
        x-data="{ open: false }"
      >
        <div class="p-4 flex flex-row items-center justify-between">
          <a
            class="text-lg font-bold text-gray-900 flex rounded-lg dark:text-white focus:outline-none focus:shadow-outline items-center"
            href="#"
          >
            <img alt="Léo Corporation" class="h-10 w-10" src="img/logo.png" />
            <p>Privacy</p>
          </a>
          <button
            @click="open = !open"
            class="md:hidden rounded-lg focus:outline-none focus:shadow-outline"
          >
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
              <path
                clip-rule="evenodd"
                d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM9 15a1 1 0 011-1h6a1 1 0 110 2h-6a1 1 0 01-1-1z"
                fill-rule="evenodd"
                x-show="!open"
              ></path>
              <path
                clip-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                fill-rule="evenodd"
                x-show="open"
              ></path>
            </svg>
          </button>
        </div>
        <nav
          :class="{'flex': open, 'hidden': !open}"
          class="flex-col flex-grow pb-4 md:pb-0 hidden md:flex md:flex-row"
        >
          <a
            class="px-4 py-2 mt-2 text-sm font-semibold bg-transparent rounded-lg dark:bg-transparent dark:hover:bg-gray-600 dark:focus:bg-gray-600 dark:focus:text-white dark:hover:text-white dark:text-gray-200 md:mt-0 md:ml-4 hover:text-gray-900 focus:text-gray-900 hover:bg-gray-200 focus:bg-gray-200 focus:outline-none focus:shadow-outline"
            href="distribution"
            >Software distribution</a
          >
          <a
            class="px-4 py-2 mt-2 text-sm font-semibold rounded-lg dark:hover:bg-gray-600 dark:focus:bg-gray-600 dark:focus:text-white dark:hover:text-white dark:text-gray-200 md:mt-0 md:ml-4 hover:text-gray-900 focus:text-gray-900 hover:bg-gray-200 focus:bg-gray-200 focus:outline-none focus:shadow-outline"
            href="https://blog.leocorporation.dev/"
            >Blog</a
          >
          <a
            class="px-4 py-2 mt-2 text-sm font-semibold bg-transparent rounded-lg dark:bg-transparent dark:hover:bg-gray-600 dark:focus:bg-gray-600 dark:focus:text-white dark:hover:text-white dark:text-gray-200 md:mt-0 md:ml-4 hover:text-gray-900 focus:text-gray-900 hover:bg-gray-200 focus:bg-gray-200 focus:outline-none focus:shadow-outline"
            href="https://leocorporation.dev/contact"
            >Contact</a
          >
        </nav>
      </div>
    </div>

    <footer
      class="grid grid-cols-1 sm:grid-cols-2 p-16 dark:bg-gray-800 bg-gray-100 dark:text-gray-300 text-gray-500"
    >
      <div class="flex flex-col">
        <h3 class="font-bold mb-5">ABOUT</h3>
        <p id="copyright">© Léo Corporation</p>
        <a class="hover:underline" href="https://status.leocorporation.dev/"
          >Status</a
        >
      </div>
      <div class="flex flex-col mt-4 sm:mt-0" id="social-networks">
        <h3 class="font-bold mb-5">SOCIAL</h3>
        <div class="flex">
          <a
            href="https://github.com/Leo-Corporation/"
            rel="noopener noreferrer"
            target="_blank"
            title="GitHub"
          >
            <img
              alt="Image"
              class="h-6 mr-5"
              src="https://img.icons8.com/fluent-systems-filled/48/6b7280/github.png"
            />
          </a>
          <a
            href="https://twitter.com/LeoCorpNews"
            rel="noopener noreferrer"
            target="_blank"
            title="Twitter"
          >
            <img
              alt="Image"
              class="h-6 mr-5"
              src="https://img.icons8.com/fluent-systems-filled/48/6b7280/twitter.png"
            />
          </a>
          <a
            href="https://www.youtube.com/channel/UC283Dtf6EJ8eKfRoo0ISmqg"
            rel="noopener noreferrer"
            target="_blank"
            title="YouTube"
          >
            <img
              alt="Image"
              class="h-6 mr-5"
              src="https://img.icons8.com/fluency-systems-filled/48/6b7280/youtube-play.png"
            />
          </a>
          <a
            href="https://www.instagram.com/leocorporation_/"
            rel="noopener noreferrer"
            target="_blank"
            title="Instagram"
          >
            <img
              alt="Image"
              class="h-6 mr-5"
              src="https://img.icons8.com/fluency-systems-filled/48/6b7280/instagram-new.png"
            />
          </a>
          <a
            href="https://www.facebook.com/LeoCorporationSoftwares/"
            rel="noopener noreferrer"
            target="_blank"
            title="Facebook"
          >
            <img
              alt="Image"
              class="h-6 mr-5"
              src="https://img.icons8.com/fluency-systems-filled/48/6b7280/facebook-new.png"
            />
          </a>
        </div>
      </div>
    </footer>

    <script src="scripts/scroll.js"></script>
    <script src="scripts/copyright.js"></script>
  </body>
</html>
